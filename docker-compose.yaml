services:
  postgres:
    image: postgres:16-alpine
    container_name: eshop-postgres

    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - eshop_pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../eshop-seller-service/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "${ESHOP_SELLER_POSTGRES_DSN}" ,
        "up"
      ]
    restart: "no"

  seller-test-migrator:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../eshop-seller-service/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "${ESHOP_SELLER_TEST_DSN}",
        "up"
      ]
    restart: "no"

  seller-service:
    build:
      context: ../eshop-seller-service
      dockerfile: Dockerfile

    container_name: eshop-seller-service

    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

    environment:
      CONFIG_PATH: /app/config/local.yaml
      POSTGRES_DSN: ${ESHOP_SELLER_POSTGRES_DSN}

    ports:
      - "44045:44045"

    restart: unless-stopped

volumes:
  eshop_pg_data:
